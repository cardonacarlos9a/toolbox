# Static pages: every folder copied into _site is served at /toolbox/<folder>/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "me-voy-practice/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r me-voy-practice _site/
          rm -f _site/me-voy-practice/README.md
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=me-voy-practice/"><title>toolbox</title>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
